[platformio]
default_envs = atoms3

; 全環境で同じバージョンを使い、端末間で挙動が変わらないよう固定する。
[common]
lib_deps =
  m5stack/M5Unified@0.2.22
  m5stack/M5GFX@0.2.29
  m5stack/M5UnitQRCode@1.0.1
  bblanchon/ArduinoJson@7.2.1

[env:atoms3]
platform = espressif32@6.9.0
board = m5stack-atoms3
framework = arduino
; 診断専用ソースを通常ファームウェアへ混ぜない。
build_src_filter =
  +<*>
  -<official_qrcode_smoke.cpp>
monitor_speed = 115200
upload_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1

; AtomS3実運用版。秘密情報はGit対象外のsecrets.hから読み込む。
[env:atoms3-send-check]
extends = env:atoms3
build_flags =
  ${env:atoms3.build_flags}
  -DINVENTORY_CAPTURE_ONLY=false

; Unit QRCodeの公式I2C例に沿った、読取り切り分け専用版。
[env:atoms3-official-qrcode]
extends = env:atoms3
build_src_filter =
  -<*>
  +<official_qrcode_smoke.cpp>

; StickS3の読取り・表示確認用環境。
; PORT.Aピンと画面寸法はM5Unifiedから実行時に取得する。
[env:sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter =
  +<*>
  -<official_qrcode_smoke.cpp>
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_flags =
  --before
  usb_reset
lib_deps =
  ${common.lib_deps}
  m5stack/M5PM1@1.0.7
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; StickS3実運用版。AtomS3送信版と同じ認証情報と送信先を使う。
[env:sticks3-send-check]
extends = env:sticks3
build_flags =
  ${env:sticks3.build_flags}
  -DINVENTORY_CAPTURE_ONLY=false
