[platformio]
default_envs = native_arm

; M5GFXのSDLバックエンドで実機と同じInventoryDisplay.hを描画する。
[env]
platform = native
build_type = release
lib_deps =
  m5stack/M5GFX@0.2.29
; 最小M5Unified互換ヘッダーと本番画面ヘッダーを同じビルドで参照する。
build_flags =
  -std=c++17
  -lSDL2
  -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"
  -L"${sysenv.HOMEBREW_PREFIX}/lib"
  -I../../platformio/include
  -DM5GFX_SCALE=4
  -DM5GFX_BACK_COLOR=0xF4F7FAu

[env:native_arm]
build_flags =
  ${env.build_flags}
  -DM5GFX_BOARD=board_M5AtomS3
  -arch arm64

[env:native]
build_flags =
  ${env.build_flags}
  -DM5GFX_BOARD=board_M5AtomS3

[env:sticks3_arm]
build_flags =
  ${env.build_flags}
  -DM5GFX_BOARD=board_M5StickS3
  -DINVENTORY_SIMULATE_STICKS3
  -arch arm64
